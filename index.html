<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movies I've watched</title>
<style>
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --text: #17202e;
    --muted: #66728a;
    --line: #b9c2d3;
    --accent: #2c5fd6;
    --serif: Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101826;
      --surface: #182338;
      --text: #e9edf5;
      --muted: #8c99b0;
      --line: #35435e;
      --accent: #7fb4ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 var(--sans);
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 56px 20px 80px; }
  h1 {
    font: 400 clamp(2rem, 6vw, 3.2rem)/1.1 var(--serif);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  #stats { color: var(--muted); margin: 0 0 48px; }

  .year {
    font: 400 clamp(3.5rem, 14vw, 6.5rem)/1 var(--serif);
    color: transparent;
    -webkit-text-stroke: 1.5px var(--line);
    margin: 48px 0 8px;
  }
  .entries { position: relative; padding-left: 28px; }
  .entries::before {
    content: "";
    position: absolute; left: 5px; top: 0; bottom: 0;
    border-left: 2px dashed var(--line);
  }
  .entry { position: relative; display: flex; gap: 18px; margin: 0 0 28px; }
  .entry::before {
    content: "";
    position: absolute; left: -28px; top: 10px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--bg);
  }
  .poster {
    flex: 0 0 96px; width: 96px; height: 144px;
    border-radius: 4px; object-fit: cover;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .body { min-width: 0; }
  .date { color: var(--accent); font-weight: 600; font-size: .9rem; }
  .title { font: 400 1.45rem/1.2 var(--serif); margin: 2px 0 4px; }
  .title small { color: var(--muted); font-size: .95rem; }
  .meta { color: var(--muted); font-size: .88rem; margin: 0 0 8px; }
  .tagline { font-style: italic; margin: 0 0 6px; }
  .overview {
    margin: 0 0 8px; font-size: .92rem;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cast { color: var(--muted); font-size: .85rem; margin: 0; }
  .ratings { margin: 8px 0 0; font-size: .88rem; display: flex; gap: 14px; flex-wrap: wrap; }
  .ratings a { color: var(--accent); }
  .mine { font-weight: 600; }
  #empty { color: var(--muted); }
  footer { color: var(--muted); font-size: .8rem; margin-top: 64px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 520px) {
    .poster { flex-basis: 72px; width: 72px; height: 108px; }
    .entry { gap: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Movies I've watched</h1>
  <p id="stats"></p>
  <main id="timeline"></main>
  <footer>Movie data and posters from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
</div>

<script>
(async function () {
  const root = document.getElementById("timeline");
  const stats = document.getElementById("stats");
  const IMG = "https://image.tmdb.org/t/p/w185";

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function hm(min) {
    if (!min) return "";
    const h = Math.floor(min / 60), m = min % 60;
    return h ? h + "h " + String(m).padStart(2, "0") + "m" : m + "m";
  }

  let movies = [];
  try {
    const r = await fetch("movies.json", { cache: "no-store" });
    movies = await r.json();
  } catch (e) {
    root.appendChild(el("p", null, "Could not load movies.json."));
    return;
  }
  if (!movies.length) {
    root.appendChild(el("p", null, "No movies yet. Run add_movie.py to add your first one."));
    return;
  }

  movies.sort((a, b) => (b.watched_on + b.added_at).localeCompare(a.watched_on + a.added_at));

  const mins = movies.reduce((s, m) => s + (m.runtime || 0), 0);
  stats.textContent = movies.length + " films, " + Math.round(mins / 60) + " hours watched";

  let currentYear = null, list = null;
  for (const m of movies) {
    const year = m.watched_on.slice(0, 4);
    if (year !== currentYear) {
      currentYear = year;
      root.appendChild(el("h2", "year", year));
      list = el("div", "entries");
      root.appendChild(list);
    }

    const entry = el("article", "entry");
    const poster = document.createElement("img");
    poster.className = "poster";
    poster.alt = m.poster ? "Poster of " + m.title : "";
    poster.loading = "lazy";
    if (m.poster) poster.src = IMG + m.poster;
    entry.appendChild(poster);

    const body = el("div", "body");
    const d = new Date(m.watched_on + "T00:00:00");
    body.appendChild(el("div", "date",
      d.toLocaleDateString(undefined, { day: "numeric", month: "long" })));

    const title = el("h3", "title", m.title);
    if (m.year) title.appendChild(el("small", null, " (" + m.year + ")"));
    body.appendChild(title);

    const bits = [];
    if (m.director && m.director.length) bits.push("Directed by " + m.director.join(", "));
    if (m.runtime) bits.push(hm(m.runtime));
    if (m.genres && m.genres.length) bits.push(m.genres.join(", "));
    body.appendChild(el("p", "meta", bits.join("  |  ")));

    if (m.tagline) body.appendChild(el("p", "tagline", m.tagline));
    if (m.overview) body.appendChild(el("p", "overview", m.overview));
    if (m.cast && m.cast.length) body.appendChild(el("p", "cast", "With " + m.cast.join(", ")));

    const ratings = el("p", "ratings");
    if (m.my_rating != null) ratings.appendChild(el("span", "mine", "My rating: " + m.my_rating + "/10"));
    if (m.tmdb_rating != null) ratings.appendChild(el("span", null, "TMDB: " + m.tmdb_rating));
    if (m.imdb_id) {
      const a = el("a", null, "IMDb");
      a.href = "https://www.imdb.com/title/" + m.imdb_id + "/";
      a.target = "_blank"; a.rel = "noopener";
      ratings.appendChild(a);
    }
    if (ratings.childNodes.length) body.appendChild(ratings);

    entry.appendChild(body);
    list.appendChild(entry);
  }
})();
</script>
</body>
</html>
